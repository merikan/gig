[env]
_.path = ["./target/debug"]

[tools]
rust = { version = "latest", components = "rust-analyzer,clippy,rustfmt" }
"cargo:cargo-tarpaulin" = "latest"
actionlint = "latest"
tombi = "latest"

[settings]
lockfile = true

[task_config]
includes = ["etc/mise/tasks/"]

[tasks.build]
description = "Build the project"
run = "cargo build"

[tasks."build:release"]
description = "Build the project with optimizations"
run = "cargo build --release"

[tasks.run]
description = "Run the application"
run = "cargo run"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks."test:coverage"]
description = "Run tests with coverage (fails if below 90%)"
run = """
cargo tarpaulin --out html --output-dir target/coverage --fail-under 90
echo "Coverage report generated: target/coverage/tarpaulin-report.html"
"""

[tasks.lint]
description = "Lint the code with Clippy"
run = """
echo "running clippy"; cargo clippy
echo "running tombi"; tombi lint mise.toml
echo "running actionlint"; actionlint .github/workflows/*.yml
"""

[tasks."fmt:check"]
description = "Check code formatting without modifying files"
run = "cargo fmt --check"

[tasks.ci]
description = "Run all checks (check, lint, fmt:check, test)"
depends = ["check", "lint", "fmt:check", "test"]

[tasks.format]
description = "Format the code"
alias = "fmt"
run = "cargo fmt"

[tasks.check]
description = "Check the project for errors"
run = "cargo check"

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

[tasks.doc]
description = "Generate and open documentation"
run = "cargo doc --open"

[tasks."mise:install"]
description = "Install tools"
run = "mise install --local"

[tasks."mise:upgrade"]
description = "Upgrade tools version"
run = "mise upgrade --bump --local"
